[project]
name = "n8n-mcp-server"
version = "0.1.0"
description = "MCP server for managing n8n workflows, executions, and diagnostics"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
n8n-mcp = "n8n_mcp.server:main"
n8n-api = "n8n_mcp.api.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/n8n_mcp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
